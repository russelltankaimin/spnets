[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spnet"
version = "0.1.0"
description = "Index policies and exact subgradients for adaptive planning on series-parallel task networks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
spnet = "spnet.cli:main"

[tool.setuptools]
packages = ["spnet"]
